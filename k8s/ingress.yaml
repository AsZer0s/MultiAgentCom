apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multiagentcom
  namespace: multiagentcom
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: multiagentcom.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multiagentcom
                port:
                  number: 80
  tls:
    - hosts:
        - multiagentcom.example.com
      secretName: multiagentcom-tls
