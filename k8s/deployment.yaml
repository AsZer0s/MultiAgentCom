apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiagentcom
  namespace: multiagentcom
  labels:
    app.kubernetes.io/name: multiagentcom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multiagentcom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multiagentcom
    spec:
      containers:
        - name: multiagentcom
          image: multiagentcom:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: multiagentcom-config
            - secretRef:
                name: multiagentcom-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: app-data
              mountPath: /data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: multiagentcom-data
